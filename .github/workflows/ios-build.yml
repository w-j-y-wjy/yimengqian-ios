# iOS 编译验证（模拟器 · 免签名 · 产物截图）
#
# 为什么在云端编译：本地只有 macOS Monterey + Xcode 14.2，且 Xcode 14.2 已不在
# GitHub Actions 的 runner 镜像里（现役 macOS 15 → Xcode 16.x）。所以：
#   · 这里是「主证据」：每次推送都编译一次，红了就是真的编译不过；
#   · 老 Mac 上的 Xcode 14.2 只在关键节点做「第二意见」（见 docs/项目结构与构建.md）。
# 成本：公开仓库免费；私有仓库 macOS 按 Linux 的 ~10 倍计分钟，故只在相关路径变更时触发。

name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'Yimengqian/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'Yimengqian/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Yimengqian/Yimengqian.xcodeproj
  SCHEME: Yimengqian
  BUNDLE_ID: com.yimeng.qiannian

jobs:
  simulate:
    name: 编译 + 模拟器冒烟
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcodebuild -version
          echo "--- 可用模拟器（前 15 行）---"
          xcrun simctl list devices available | head -15

      - name: 选择模拟器
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]+iPhone' \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "${UDID:-}" ]; then
            echo "::error::没能从 simctl 列表里解析出 iPhone 模拟器 UDID"
            xcrun simctl list devices available
            exit 1
          fi
          echo "使用模拟器：$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 编译（模拟器 · 免签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          echo "--- 统计 ---"
          echo "warning 行数: $(grep -c 'warning:' build.log || true)"
          echo "error   行数: $(grep -c 'error:' build.log || true)"
          echo "### 编译通过（$(xcodebuild -version | head -1)）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(warning|error):" build.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 资源打包断言（设计稿 25 张 / 不夹带 Reference / 体积）
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          # 设计稿目录：文件夹引用可能落在 App 根下的 Screens/ 或 Content/Screens/，两种都认
          RES=""
          for cand in "$APP/Screens" "$APP/Content/Screens"; do
            [ -d "$cand" ] && RES="$cand" && break
          done
          if [ -z "$RES" ]; then
            echo "::error::App 里找不到设计稿目录（Screens/ 或 Content/Screens/）"
            ls -R "$APP" | head -40
            exit 1
          fi
          COUNT=$(find "$RES" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
          echo "设计稿目录：$RES"
          echo "设计稿数量：$COUNT"
          [ "$COUNT" -eq 25 ] || { echo "::error::设计稿应为 25 张，实际 $COUNT"; exit 1; }

          # 死资源守卫：Content/Reference 有 55.7 MB，且 24/25 张文件名与内容错配，绝不能进包
          if find "$APP" -maxdepth 3 -type d -name 'Reference' | grep -q .; then
            echo "::error::Reference 目录仍被打包进 App（应为 0，否则白占 55.7 MB）"
            find "$APP" -maxdepth 3 -type d -name 'Reference'
            exit 1
          fi

          # 内容配图守卫：ContentData 里 23 处 image 指向 ArtApp/，若目录没进包就会静默白屏
          ART=$(find "$APP" \( -name '*.jpg' -o -name '*.png' \) -path '*ArtApp*' | wc -l | tr -d ' ')
          echo "配图数量：$ART"
          [ "$ART" -eq 31 ] || {
            echo "::error::ArtApp 应为 31 个文件（27 jpg + 4 png），实际 $ART"
            find "$APP" -maxdepth 4 -type d | head -20
            exit 1
          }

          SIZE_MB=$(du -sm "$APP" | cut -f1)
          echo "App 体积：${SIZE_MB} MB（基线 113 MB，去掉 Reference 后应约 58 MB）"
          {
            echo "### 资源打包断言通过"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 设计稿数量 | $COUNT / 25 |"
            echo "| 内容配图数量 | $ART / 30 |"
            echo "| Reference 进包 | 否 |"
            echo "| App 体积 | ${SIZE_MB} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 模拟器冒烟（安装 → 启动 → 截图 → 查崩溃）
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$APP" || { echo "::error::找不到 .app 产物：$APP"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$UDID" screenshot splash.png
          ls -l splash.png
          if ls ~/Library/Logs/DiagnosticReports/Yimengqian* >/dev/null 2>&1; then
            echo "::error::启动后产生了崩溃日志"
            ls -l ~/Library/Logs/DiagnosticReports/ | tail -20
            exit 1
          fi
          echo "### 冒烟通过：应用能安装、启动、无崩溃" >> "$GITHUB_STEP_SUMMARY"

      - name: 本机比对分数矩阵（阈值是否站得住，看数据）
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen home -dumpScoreMatrix 1 >/dev/null
          # Vision 请求 + 14 张图 × 4 件比对，给足时间
          sleep 18
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          MATRIX="$DATA/Documents/score-matrix.txt"
          if [ ! -f "$MATRIX" ]; then
            echo "::error::分数矩阵没有生成（$MATRIX）"
            exit 1
          fi
          cat "$MATRIX" | tee score-matrix.txt
          {
            echo "### 本机比对分数矩阵（自比对 vs 干扰图）"
            echo '```'
            cat "$MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 叠层验证截图（偏好测试 / 飞花令 / 收藏页）
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          # 用启动参数直接进到目标屏并预置选择（iOS 会把 -key value 注入 UserDefaults）
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen preference-test \
            -preferenceScene landscape \
            -preferenceDynasty northernSong
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-preference-test.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen feihualing-challenge \
            -feihualingAnswer B
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-feihualing.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 收藏页（A 线）：默认视图有 3 条示例收藏（人物/书信/印章），
          # 再跑一次「诗词」筛选 —— 示例里没有诗词收藏，正好验证空槽「暂无收藏」与筛选条重绘。
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen favorites
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-favorites.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen favorites \
            -favoriteFilter poetry
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-favorites-filtered.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 收藏编辑模式（S29）：卡片右上角应出现移除标记
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen favorites \
            -favoritesEditing true
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-favorites-editing.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 个人中心（A-6）：四张统计卡的数字应来自真实收藏计数，不是设计稿里烤死的 128/86/43/27
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen profile
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-profile.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 个人资料编辑（S35）：预置自定义昵称/身份，验证个人中心文字跟着变
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -profileName "听雨客" \
            -profileTitle "山水闲人"
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-profile-edited.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -nativeDetail /native/profile/main
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-profile-edit.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 自定义头像（S35 b）：直接把一张图塞进 App 沙盒 Documents/avatar.png，
          # 验证"换过头像后头像仍在原位、铅笔徽标没被裁掉"。
          # 为什么要走文件而不是 UI：PHPicker 需要人手点，模拟器里没法脚本化选图。
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          echo "沙盒：$DATA"
          sips -Z 512 -s format png \
            Yimengqian/Yimengqian/Content/ArtApp/character-liqingzhao.jpg \
            --out "$DATA/Documents/avatar.png" >/dev/null
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen profile
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-profile-avatar.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          rm -f "$DATA/Documents/avatar.png"   # 别把定制头像带进后面的扫屏

          # 原生详情页（大整改 S1）：设计稿里没有的详情改由原生页承载
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen poetry-home \
            -nativeDetail /native/poem/niao-ming-jian
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-poem.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen dynasties \
            -nativeDetail /native/city/tang
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-city.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 原生列表页（S10）：诗库 + 搜索框
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen poetry-home \
            -nativeDetail /native/list/poems
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-list.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 器物详情（S10）：纹样大图与要素图画廊
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/artifact/qinghua-ping
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-artifact.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 设置页（S11）与作品列表（S12）
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -nativeDetail /native/settings/main
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-settings.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -nativeDetail /native/list/works
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-works.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 诗境卡选项叠层（S15）：用启动参数预置非默认选择，验证选中态会跟着走
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen poetry-card \
            -poetryCardStyle song \
            -poetryCardLayout vertical \
            -poetryCardSeal none
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-poetry-card.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 纹样 tab 原位切换（S16）：预置「寓意象征」，验证正文与选中态一起变
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-pattern \
            -patternTab symbolism
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-pattern-tabs.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 江雪画风选中态（S31）：预置「青绿」，验证胶囊高亮跟随
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen jiangxue-scene \
            -jiangxueStyle bluegreen
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-jiangxue-style.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 全站搜索（S21）：预填关键词，验证四类内容都能搜到
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen poetry-home \
            -nativeDetail /native/search/main \
            -searchKeyword 苏轼
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-search.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 汴京城内地点（S22）：书院 / 瓦舍 / 酒肆 / 药坊 / 码头
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen bianjing \
            -nativeDetail /native/spot/shuyuan
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-spot.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 题注编辑（S24）：预填 cardNote 验证回填
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen poetry-card \
            -nativeDetail /native/note/main \
            -cardNote "此卡取水墨意，留白处最见寒江"
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-note.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 相册选图（PHPicker 在模拟器里也能弹，有内置示例照片）
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/photo/main
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-photo-pick.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 器物识别页（新增）：相册入口 / 拍摄入口都落到这一页，含本地特征比对说明
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/recognize/manual
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-recognize.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 拍摄识别入口：模拟器没有相机，应看到"这台设备没有可用摄像头 + 给相册退路"的说明
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/recognize/camera
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-recognize-camera.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 器物报告（命中参照库）：把库里的器物图当作"刚拍到的照片"喂进去，
          # 走的是和真机完全一样的一条链路（Vision 比对 → 命中 → 八项取库数据）。
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/recognize/manual \
            -demoRecognize qinghua-ping
          sleep 9
          xcrun simctl io "$UDID" screenshot overlay-artifact-profile-library.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 器物报告（未命中 + 无 key）：故意用一张不属于参照库的图，
          # 应看到「本地推断」角标、"待考"朝代与照片裁切出来的纹样局部。
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen artifact-home \
            -nativeDetail /native/recognize/manual \
            -demoRecognize generic
          sleep 9
          xcrun simctl io "$UDID" screenshot overlay-artifact-profile-infer.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 最近足迹（真实数据叠层）：预置三条足迹，验证位图里烤死的「杭州/南京」被真数据替换
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -seedFootprints "bianjing@0,linan@1,jinling@3"
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-profile-footprints.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 足迹空态：没有任何足迹时应是「还没有足迹」而不是三张假卡。
          # ⚠️ 必须带 -resetProgress：simctl 每次 launch 不会重置 UserDefaults，
          # 上一步预置的足迹会一路留着（第一版就因此拍到了"空态却仍有 3 张卡"）。
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen profile -resetProgress 1
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-profile-footprints-empty.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 足迹列表（原生页）：与我页三张卡同源
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen profile \
            -nativeDetail /native/list/footprints \
            -seedFootprints "bianjing@0,linan@1"
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-footprints.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 原生分享（UIActivityViewController 系统面板）
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen stamp-reward \
            -nativeDetail /native/share/stamp
          sleep 7
          xcrun simctl io "$UDID" screenshot overlay-native-share.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          # 古典身份详情：按 4 项偏好算出的称号 / 标签 / 释义
          # 朝代这里故意传 **northernSong** —— 偏好测试页真实写进 UserDefaults 的就是这个值，
          # 而规则表认的是 northern；不归一化就会算成 default 身份（北宋/南宋一模一样）。
          xcrun simctl launch "$UDID" "$BUNDLE_ID" \
            -initialScreen identity-result \
            -nativeDetail /native/identity/main \
            -preferenceDynasty northernSong \
            -preferenceMood quiet
          sleep 6
          xcrun simctl io "$UDID" screenshot overlay-native-identity.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

          ls -l overlay-*.png
          if ls ~/Library/Logs/DiagnosticReports/Yimengqian* >/dev/null 2>&1; then
            echo "::error::叠层截图阶段产生了崩溃日志"
            exit 1
          fi
          echo "### 叠层截图已生成（偏好测试 / 飞花令 / 收藏页 / 个人中心 / 原生详情）" >> "$GITHUB_STEP_SUMMARY"

      # 25 屏全量扫屏：逐屏冷启动 + 截图，用于回归（白屏/崩溃/设计稿缺失都会暴露）
      - name: 全量扫屏（25 屏逐屏截图）
        if: always()
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.BUNDLE_ID }}"
          SCREENS="splash home dynasties bianjing teahouse sushi teahouse-dialogue task-reward poetry-home jiangxue-scene jiangxue-analysis jiangxue-imagery poetry-card onboarding-intro preference-test identity-result artifact-home artifact-result artifact-pattern activities-home feihualing-challenge stamp-reward favorites dreambook profile"
          mkdir -p sweep
          for s in $SCREENS; do
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialScreen "$s" >/dev/null 2>&1
            sleep 3
            xcrun simctl io "$UDID" screenshot "sweep/$s.png" >/dev/null 2>&1 || echo "::warning::$s 截图失败"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          done
          ls -l sweep | head -30
          COUNT=$(ls sweep/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "### 扫屏完成：$COUNT / 25 屏" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -lt 25 ]; then
            echo "::error::扫屏截图不足 25 张（$COUNT）"
            exit 1
          fi
          if ls ~/Library/Logs/DiagnosticReports/Yimengqian* >/dev/null 2>&1; then
            echo "::error::扫屏阶段产生了崩溃日志"
            exit 1
          fi

      # 缩略图：原始 PNG 一共 160+ MB，从国内拉下来往往要半小时以上。
      # 这里额外出一套 900px 宽的 JPEG（约 5 MB），日常目检看这一份就够；
      # 需要做像素级比对（compare-sweep）时再去下完整 PNG。
      - name: 生成目检缩略图（900px JPEG）
        if: always()
        run: |
          set -o pipefail
          mkdir -p thumbs
          for f in overlay-*.png splash.png; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 78 "$f" --out "thumbs/$(basename "${f%.png}").jpg" >/dev/null 2>&1 || true
          done
          for f in sweep/*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 78 "$f" --out "thumbs/$(basename "${f%.png}")-screen.jpg" >/dev/null 2>&1 || true
          done
          echo "缩略图 $(ls thumbs/*.jpg 2>/dev/null | wc -l | tr -d ' ') 张"
          du -sh thumbs || true
          # 空白截图断言：正常屏缩略图 80–120 KB，整屏空白只有 3–9 KB。
          # 这是 2026-10-31 "整屏白屏但 CI 照样绿" 那次事故的补丁 ——
          # 之前只验"截图存在 + 没崩溃"，画面全白也能过。
          BLANK=$(ls -l thumbs/*-screen.jpg 2>/dev/null | awk '$5<20000' | wc -l | tr -d ' ')
          TOTAL=$(ls thumbs/*-screen.jpg 2>/dev/null | wc -l | tr -d ' ')
          echo "扫屏缩略图 $TOTAL 张，疑似空白 $BLANK 张"
          if [ "$BLANK" -ne 0 ]; then
            echo "::error::有 $BLANK 张扫屏缩略图小于 20KB，基本可断定整屏空白（编译过了但没渲染）"
            ls -l thumbs/*-screen.jpg | awk '$5<20000' | head -5
            exit 1
          fi

      - name: 上传证据（截图 + 编译日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.run_number }}
          path: |
            splash.png
            overlay-*.png
            sweep/*.png
            thumbs/*.jpg
            build.log
            score-matrix.txt
          retention-days: 7
          if-no-files-found: warn

      - name: 上传目检缩略图（体积小，优先下这一份）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-thumbs-${{ github.run_number }}
          path: thumbs/*.jpg
          retention-days: 7
          if-no-files-found: warn
